<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/fav.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- DESKTOP CONTAINER (Everything goes inside here) -->
<div id="desktop">

    <!-- Desktop Icons -->
<!-- My Computer Window -->
<div class="window" id="mycomputer-window">

    <!-- Title Bar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <img src="assets/icons/mycomputer.png" alt="My Computer Icon" class="titlebar-icon">
            <span class="titlebar-title">My Computer</span>
        </div>
        <div class="titlebar-buttons">
            <button class="minimize">_</button>
            <button class="maximize">□</button>
            <button class="close">X</button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="window-content">
        <h2>My Computer</h2>
        <p>Your information here</p>
    </div>

</div>

    <div class="icon">
        <img src="assets/icons/network.avif" alt="Network">
        <span>Network</span>
    </div>
    
    <div class="icon">
        <img src="assets/icons/mydocuments.png" alt="My Project">
        <span>My Projects</span>
    </div>
    <div class="icon">
        <img src="assets/icons/cmd.avif" alt="CLI">
        <span>Cmd</span>
    </div>
    <div class="icon">
        <img src="assets/icons/guestbook.avif" alt="guestbook">
        <span>Guestbook</span>
    </div>



  


<div class="taskbar">
    <!-- Start Button -->
    <div id="startbutton">
        <img src="assets/images/window_logo.png" alt="windows logo">
        <span>start</span>
    </div>

   

    <!-- Clock -->
    <div class="taskbar-clock">
        12:21 AM
    </div>
</div>
<script src="js/script.js"></script>

</body>
</html>
