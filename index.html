<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/fav.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- DESKTOP CONTAINER (Everything goes inside here) -->
<div id="desktop">

    <!-- Desktop Icons -->
    <div class="icon">
        <img src="assets/icons/mycomputer.png" alt="My Computer">
        <span>My Computer</span>
    </div>
    <div class="icon">
        <img src="assets/icons/network.avif" alt="Network">
        <span>Network</span>
    </div>
    
    <div class="icon">
        <img src="assets/icons/mydocuments.png" alt="My Project">
        <span>My Projects</span>
    </div>
    <div class="icon">
        <img src="assets/icons/cmd.avif" alt="CLI">
        <span>Cmd</span>
    </div>
    <div class="icon">
        <img src="assets/icons/guestbook.avif" alt="guestbook">
        <span>Guestbook</span>
    </div>
  


<div class="taskbar">
    <!-- Start Button -->
    <div id="startbutton">
        <img src="assets/images/window_logo.png" alt="windows logo">
        <span>start</span>
    </div>

   

    <!-- Clock -->
    <div class="taskbar-clock">
        12:21 AM
    </div>
</div>
<script src="js/script.js"></script>

</body>
</html>
